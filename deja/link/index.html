<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Deja</title>
<meta name="description" content="Return to the Deja app.">
<meta name="color-scheme" content="dark light">
<style>
:root{--bg:#212121;--surface:#2e2e2e;--text:#f5f5f5;--muted:#a7afb7;--stroke:rgba(255,255,255,.08)}
@media (prefers-color-scheme: light){:root{--bg:#fafafa;--surface:#fff;--text:#121212;--muted:#5b636b;--stroke:rgba(0,0,0,.08)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:56px 20px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:40px}
header a{color:inherit;text-decoration:none;font:700 22px/1 ui-rounded,-apple-system,sans-serif;letter-spacing:-.01em}
.mark{width:36px;height:36px;border-radius:10px;background:var(--text);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
h1{font:700 34px/1.15 ui-rounded,-apple-system,sans-serif;letter-spacing:-.02em;margin:0 0 8px}
h2{font-size:20px;margin:36px 0 8px}
p,li{color:var(--muted)}
strong{color:var(--text);font-weight:600}
a{color:var(--text)}
.lead{font-size:19px;margin:0 0 28px}
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:20px;padding:20px 22px;margin:20px 0}
.button{display:inline-block;background:var(--text);color:var(--bg);font-weight:600;text-decoration:none;padding:14px 24px;border-radius:14px;margin-top:8px}
nav{margin-top:56px;padding-top:20px;border-top:1px solid var(--stroke);display:flex;gap:20px;flex-wrap:wrap;font-size:15px}
nav a{color:var(--muted);text-decoration:none}
small{color:var(--muted)}
</style>
</head>
<body>
<main>
<header><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="13" r="3.6"/><circle cx="17" cy="13" r="3.6"/><path d="M10.6 13h2.8M3.4 13H2M22 13h-1.4"/></svg></span><a href="/deja/">Deja</a></header>

<h1>Back to Deja</h1>
<p class="lead">If Deja didn't open by itself, make sure it's installed on this iPhone, then open it to finish connecting your glasses.</p>
<a class="button" href="deja://">Open Deja</a>

<nav><a href="/deja/">Deja</a><a href="/deja/privacy/">Privacy Policy</a><a href="/deja/terms/">Terms of Use</a><a href="/deja/support/">Support</a></nav>
</main>
</body>
</html>
